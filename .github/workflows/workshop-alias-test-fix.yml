name: Correct synthetic path expectation
on:
  push:
    branches: [fix/workshop-review-queue-20260913]
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[workshop-test-alias]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply exact test-only correction and remove this helper
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          branch='fix/workshop-review-queue-20260913'
          assert os.environ['GITHUB_REPOSITORY']=='qwbwj3/personal-knowledge-base'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          p=Path('tests/test_workshop.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='d0bb619e1687b8d55be2c5fa7d6daa2a30e20454c941ffa47eace2266dab557e'
          text=p.read_text(encoding='utf-8')
          old="        read.assert_called_once_with(Path('/private/tmp/sample.json'))"
          new="        # A Windows native path must not acquire macOS alias semantics.\n        expected = Path('/tmp/sample.json').absolute() if os.name == 'nt' else Path('/private/tmp/sample.json')\n        read.assert_called_once_with(expected)"
          assert text.count(old)==1
          p.write_text(text.replace(old,new),encoding='utf-8')
          m=Path('RELEASE-MANIFEST.json');v=json.loads(m.read_text(encoding='utf-8'))
          v['files']['tests/test_workshop.py']={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'executable':False}
          m.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('.github/workflows/workshop-alias-test-fix.yml').unlink()
          subprocess.run(['python','-B','tools/verify_release.py'],check=True)
          subprocess.run(['python','-B','-m','unittest','discover','-s','tests','-v'],check=True)
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA']
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add','-A');git('commit','-m','test: distinguish Windows paths from macOS system aliases')
          print('WORKSHOP_FIXED_COMMIT='+git('rev-parse','HEAD'),flush=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
