name: Knowledge base integrated regression
on:
  push:
    branches: [main, integrate/workshop-multiformat-20260913]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '0'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install public fixture dependencies, no OCR models
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0 pypdf==5.9.0
      - name: Verify exact inventory
        run: python -B tools/verify_release.py
      - name: Integrated workshop, material and classification regressions
        run: python -B -m unittest discover -s tests -v
      - name: Check unchanged checkout
        shell: python
        run: |
          import subprocess
          if subprocess.check_output(['git', 'status', '--porcelain']):
              raise SystemExit('Tests modified the checkout')
