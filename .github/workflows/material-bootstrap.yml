name: Material source integration
on:
  push:
    branches: [feat/agent-image-spreadsheet-20260913]
permissions:
  contents: write
concurrency:
  group: material-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: contains(github.event.head_commit.message, '[material-bootstrap]')
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '0'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Public test dependencies, no OCR models
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0 pypdf==5.9.0
      - name: Expand exact reviewed source and test ordinary files
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, platform, re, subprocess, sys, time
          root = pathlib.Path.cwd()
          def git(*args):
              return subprocess.check_output(['git','-c','core.quotepath=false',*args],text=True,encoding='utf-8').strip()
          if git('rev-parse','HEAD^') != '33d20048a8efb711ef5ea865b744f9ee7ca83a11':
              raise SystemExit('Unexpected parent; preserve concurrent changes')
          encoded = b''.join((root/'_material-transfer'/('part'+str(i)+'.txt')).read_bytes() for i in range(8))
          if hashlib.sha256(encoded).hexdigest() != '5445aa7f5b4e51723bd2fd4d52b738f95fb1c2fbc1ddac91912e1361a13d2e51':
              raise SystemExit('Transport identity mismatch')
          raw = lzma.decompress(base64.b64decode(encoded,validate=True))
          if len(raw)!=124032 or hashlib.sha256(raw).hexdigest()!='2b867f2fd38f169e1ce1a5049f6d1c236b02adeab5ae3951cfb21b40b7b268b5':
              raise SystemExit('Reviewed source identity mismatch')
          payload=json.loads(raw)
          if payload['base_commit']!='632945cfe6a2ff37f12b63e1fbce9ce1f5affc2d' or len(payload['after_sha256'])!=13:
              raise SystemExit('Payload base/inventory mismatch')
          for name,expected in payload['before_sha256'].items():
              path=root/name
              if not path.resolve().is_relative_to(root) or name not in payload['after_sha256']:
                  raise SystemExit('Invalid source path')
              actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if actual!=expected: raise SystemExit('Source changed: '+name)
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'material-reviewed.patch'
          patch.write_text(payload['patch'],encoding='utf-8',newline='')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          (root/'docs/MULTIFORMAT-DEVELOPMENT.md').write_text(payload['design'],encoding='utf-8',newline='')
          for name,expected in payload['after_sha256'].items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=expected:
                  raise SystemExit('Expanded source mismatch: '+name)
          subprocess.run(['git','rm','-r','--','_material-transfer'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          entries={}
          records=subprocess.check_output(['git','ls-files','--stage','-z']).decode('utf-8').split('\0')
          for record in records:
              if not record: continue
              meta,name=record.split('\t',1)
              if name=='RELEASE-MANIFEST.json': continue
              data=(root/name).read_bytes()
              entries[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'executable':meta.split()[0]=='100755'}
          manifest={'schema':'personal-kb.release-inventory.v1','version':'1.3.0-rc.1','files':entries}
          (root/'RELEASE-MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='')
          subprocess.run(['git','add','RELEASE-MANIFEST.json'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: integrate agent-native image ingestion and structured spreadsheets'],check=True)
          sha=git('rev-parse','HEAD'); print('MATERIAL_TESTED_SHA='+sha,flush=True)
          started=time.monotonic()
          verify=subprocess.run([sys.executable,'-B','tools/verify_release.py'],capture_output=True,text=True,encoding='utf-8',timeout=30)
          cp=subprocess.run([sys.executable,'-B','-m','unittest','discover','-s','tests','-v'],capture_output=True,text=True,encoding='utf-8',timeout=180)
          output=cp.stdout+'\n'+cp.stderr; print(verify.stdout,flush=True);print(output,flush=True)
          counts=re.findall(r'Ran (\d+) tests? in ',output)
          result={'source_commit':sha,'os':platform.platform(),'python':sys.version,'expected':38,'executed':int(counts[-1]) if len(counts)==1 else None,'exit_code':cp.returncode,'inventory_verified':verify.returncode==0,'failed_records':len(re.findall(r'^FAIL:',output,re.M)),'error_records':len(re.findall(r'^ERROR:',output,re.M)),'skip_records':len(re.findall(r'^.* \.\.\. skipped',output,re.M)),'elapsed_seconds':round(time.monotonic()-started,3),'actual_engine_calculation_tested':False,'actual_multimodal_model_tested':False,'real_business_materials':False,'checkout_unchanged':not subprocess.check_output(['git','status','--porcelain'])}
          result['success']=result['executed']==38 and cp.returncode==0 and verify.returncode==0 and not any(result[k] for k in ['failed_records','error_records','skip_records']) and result['checkout_unchanged']
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'material-result.json').write_text(json.dumps(result,ensure_ascii=True,indent=2)+'\n',encoding='utf-8')
          print('MATERIAL_RESULT='+json.dumps(result),flush=True)
          if not result['success']: raise SystemExit(1)
      - name: Publish tested feature branch without force
        shell: python
        run: |
          import os, subprocess
          branch='feat/agent-image-spreadsheet-20260913'
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          if remote!=os.environ['GITHUB_SHA']: raise SystemExit('Remote advanced; preserve concurrent changes')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
      - name: Preserve fixed test identity even if publishing fails
        if: always()
        shell: python
        run: |
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'material-result.json'
          print(p.read_text(encoding='utf-8') if p.is_file() else '{"success":false,"status":"no_result"}')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: material-result
          path: ${{ runner.temp }}/material-result.json
          retention-days: 1
          if-no-files-found: ignore
