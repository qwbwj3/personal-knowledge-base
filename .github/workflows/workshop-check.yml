name: Workshop regression
on:
  push:
    branches: [fix/workshop-review-queue-20260913]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Verify fixed inventory
        run: python -B tools/verify_release.py
      - name: Synthetic workshop and format regressions
        run: python -B -m unittest discover -s tests -v
      - name: Check unchanged checkout
        shell: python
        run: |
          import subprocess
          if subprocess.check_output(['git', 'status', '--porcelain']):
              raise SystemExit('Tests changed the checkout')
